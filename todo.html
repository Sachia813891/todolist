<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>To-Do List with Calendar</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 25px;
      line-height: 1.4;
      background-color: #fff;
      color: #333;
    }
    input[type="text"], input[type="date"], select {
      padding: 4px 6px;
      font-size: 13px;
    }
    button {
      padding: 3px 8px;
      cursor: pointer;
      font-size: 13px;
    }
    
    .status-bar {
      margin-bottom: 15px;
      font-size: 13px;
      color: #666;
    }

    /* 左右雙欄佈局 */
    .main-layout {
      display: flex;
      gap: 30px;
      align-items: flex-start;
    }
    .left-panel {
      flex: 1;
      min-width: 460px;
      max-width: 650px;
    }
    .right-panel {
      flex: 1.3;
      min-width: 580px;
      position: sticky;
      top: 20px;
    }

    /* 大項目外框 */
    .group-item {
      border: 1px solid #ccc;
      background: #fafafa;
      margin-bottom: 15px;
      padding: 10px;
      cursor: grab;
      border-radius: 4px;
    }
    .group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .group-title-area {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
      font-size: 16px;
    }
    .btn-group {
      display: flex;
      gap: 4px;
      align-items: flex-start;
      flex-shrink: 0;
    }

    /* 子項目清單 */
    .sub-list {
      list-style-type: none;
      padding-left: 15px;
      margin: 0;
      min-height: 15px;
    }
    .sub-item {
      border: 1px dashed #bbb;
      background: #fff;
      margin: 4px 0;
      padding: 6px 8px;
      cursor: grab;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      border-radius: 3px;
    }
    .sub-content {
      word-break: break-word;
      flex-grow: 1;
    }

    /* 日期標籤樣式 */
    .badge {
      font-size: 11px;
      border-radius: 3px;
      padding: 1px 5px;
      margin-left: 5px;
      white-space: nowrap;
      font-weight: 500;
    }
    .badge-event {
      background: #e8f0fe;
      border: 1px solid #aecbfa;
      color: #1a73e8;
    }
    .badge-deadline {
      background: #fce8e6;
      border: 1px solid #fad2cf;
      color: #c5221f;
    }

    /* 拖曳樣式 */
    .dragging {
      opacity: 0.3;
      border: 2px dashed #000 !important;
    }

    /* =================== 工整化月曆樣式 =================== */
    .calendar-container {
      border: 1px solid #ccc;
      background: #fafafa;
      padding: 12px;
      border-radius: 4px;
    }
    .calendar-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .calendar-nav h3 {
      margin: 0;
      font-size: 17px;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      background: #ddd;
      border: 1px solid #ddd;
    }
    .cal-header-cell {
      background: #f0f0f0;
      text-align: center;
      font-weight: bold;
      padding: 6px 0;
      font-size: 12px;
      color: #555;
    }
    .cal-cell {
      background: #fff;
      min-height: 105px;
      max-height: 105px;
      padding: 4px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow-y: auto;
      scrollbar-width: thin; /* 縮小捲軸 */
    }
    .cal-cell.empty {
      background: #f8f8f8;
    }
    .cal-date-num {
      font-size: 11px;
      font-weight: bold;
      color: #555;
      margin-bottom: 1px;
      line-height: 1;
    }
    .cal-cell.today {
      background: #fffde7;
    }
    .cal-cell.today .cal-date-num {
      color: #d93025;
    }

    /* 月曆內工整卡片 */
    .cal-task-pill {
      font-size: 11px;
      padding: 3px 5px;
      border-radius: 3px;
      line-height: 1.25;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }
    .cal-pill-tag {
      font-size: 9px;
      font-weight: bold;
      letter-spacing: 0.3px;
      opacity: 0.85;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 1px;
    }
    .cal-pill-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis; /* 單字超長時以 ... 優雅結尾，不粗暴切斷 */
    }

    .cal-task-event {
      background: #e8f0fe;
      border-left: 3px solid #1a73e8;
      color: #174ea6;
    }
    .cal-task-deadline {
      background: #fce8e6;
      border-left: 3px solid #d93025;
      color: #a50e0e;
    }
  </style>

  <!-- 引入 Firebase SDK (CDN 模組) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDfBeBEnTrxDMJVDkyFZvI9zNTsOhw33rw",
      authDomain: "to-do-list-8126d.firebaseapp.com",
      projectId: "to-do-list-8126d",
      storageBucket: "to-do-list-8126d.firebasestorage.app",
      messagingSenderId: "328062215967",
      appId: "1:328062215967:web:c796210d0270fb5628b22a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const todoDocRef = doc(db, "todos", "main_list");

    let todoData = [];

    // 當前行事曆瀏覽的 年 與 月
    let currentCalYear = new Date().getFullYear();
    let currentCalMonth = new Date().getMonth();

    // 即時監聽資料庫
    onSnapshot(todoDocRef, (docSnap) => {
      document.getElementById('sync-status').innerText = '🟢 雲端已連線，即時同步中';
      if (docSnap.exists()) {
        todoData = docSnap.data().items || [];
      } else {
        todoData = [];
      }
      render();
    }, (error) => {
      console.error(error);
      document.getElementById('sync-status').innerText = '🔴 連線失敗，請檢查金鑰或網路';
    });

    async function saveData() {
      document.getElementById('sync-status').innerText = '⏳ 雲端同步中...';
      try {
        await setDoc(todoDocRef, { items: todoData });
      } catch (e) {
        console.error("寫入失敗: ", e);
        alert("資料儲存失敗，請檢查連線！");
      }
    }

    window.addGroup = function() {
      const input = document.getElementById('new-group-input');
      const val = input.value.trim();
      if (!val) return;

      todoData.push({
        id: Date.now(),
        title: val,
        subs: []
      });
      input.value = '';
      saveData();
    };

    window.editGroup = function(gIndex) {
      const currentTitle = todoData[gIndex].title;
      const newTitle = prompt('請修改名稱：', currentTitle);
      if (newTitle !== null && newTitle.trim() !== '') {
        todoData[gIndex].title = newTitle.trim();
        saveData();
      }
    };

    window.deleteGroup = function(gIndex) {
      if (confirm('確定要Delete整個項目嗎？')) {
        todoData.splice(gIndex, 1);
        saveData();
      }
    };

    window.addSub = function(gIndex) {
      const textInput = document.getElementById(`sub-input-${gIndex}`);
      const dateInput = document.getElementById(`sub-date-${gIndex}`);
      const typeSelect = document.getElementById(`sub-type-${gIndex}`);

      const textVal = textInput.value.trim();
      const dateVal = dateInput.value;
      const typeVal = typeSelect.value;

      if (!textVal) return;

      const finalType = dateVal ? (typeVal === 'none' ? 'deadline' : typeVal) : 'none';

      todoData[gIndex].subs.push({
        text: textVal,
        date: dateVal || '',
        dateType: finalType
      });

      textInput.value = '';
      dateInput.value = '';
      typeSelect.value = 'none';
      saveData();
    };

    window.editSub = function(gIndex, sIndex) {
      const item = todoData[gIndex].subs[sIndex];
      const newText = prompt('請修改項目內容：', item.text);
      if (newText === null || newText.trim() === '') return;

      const newDate = prompt('請Type日期 (格式: YYYY-MM-DD，若無請留空)：', item.date || '');
      let newType = item.dateType;

      if (newDate && newDate.trim() !== '') {
        const choice = prompt('請設定日期屬性：\nType 1 代表 [參加日 / Event Date]\nType 2 代表 [截止日 / Deadline]', item.dateType === 'event' ? '1' : '2');
        newType = (choice === '1') ? 'event' : 'deadline';
      } else {
        newType = 'none';
      }

      todoData[gIndex].subs[sIndex] = {
        text: newText.trim(),
        date: newDate !== null ? newDate.trim() : '',
        dateType: newType
      };
      saveData();
    };

    window.deleteSub = function(gIndex, sIndex) {
      todoData[gIndex].subs.splice(sIndex, 1);
      saveData();
    };

    window.changeMonth = function(delta) {
      currentCalMonth += delta;
      if (currentCalMonth < 0) {
        currentCalMonth = 11;
        currentCalYear -= 1;
      } else if (currentCalMonth > 11) {
        currentCalMonth = 0;
        currentCalYear += 1;
      }
      renderCalendar();
    };

    window.jumpToToday = function() {
      const now = new Date();
      currentCalYear = now.getFullYear();
      currentCalMonth = now.getMonth();
      renderCalendar();
    };

    window.showTaskDetail = function(groupTitle, taskText, date, dateType) {
      const typeStr = dateType === 'event' ? '🗓️ 參加日' : '⏳ 截止日';
      alert(`【${groupTitle}】\n任務: ${taskText}\n類型: ${typeStr}\n日期: ${date}`);
    };

    function render() {
      renderTodoList();
      renderCalendar();
    }

    function renderTodoList() {
      const container = document.getElementById('todo-container');
      container.innerHTML = '';

      todoData.forEach((group, gIndex) => {
        const groupEl = document.createElement('div');
        groupEl.className = 'group-item';
        groupEl.draggable = true;

        bindDragEvents(groupEl, 'group', gIndex);

        groupEl.innerHTML = `
          <div class="group-header">
            <div class="group-title-area">
              <span>☰</span>
              <span>${escapeHtml(group.title)}</span>
            </div>
            <div class="btn-group">
              <button onclick="editGroup(${gIndex})">Edit</button>
              <button onclick="deleteGroup(${gIndex})">Delete</button>
            </div>
          </div>
          <div style="margin-bottom: 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">
            <input type="text" id="sub-input-${gIndex}" placeholder="Type" style="width: 160px;">
            <input type="date" id="sub-date-${gIndex}">
            <select id="sub-type-${gIndex}">
              <option value="none">No Date</option>
              <option value="event">As Date</option>
              <option value="deadline">As Deadline</option>
            </select>
            <button onclick="addSub(${gIndex})">Add</button>
          </div>
        `;

        const subList = document.createElement('ul');
        subList.className = 'sub-list';

        group.subs.forEach((subItem, sIndex) => {
          const subEl = document.createElement('li');
          subEl.className = 'sub-item';
          subEl.draggable = true;

          bindDragEvents(subEl, 'sub', gIndex, sIndex);

          let badgeHtml = '';
          if (subItem.date) {
            if (subItem.dateType === 'event') {
              badgeHtml = `<span class="badge badge-event">🗓️ date: ${escapeHtml(subItem.date)}</span>`;
            } else {
              badgeHtml = `<span class="badge badge-deadline">⏳ deadline: ${escapeHtml(subItem.date)}</span>`;
            }
          }

          subEl.innerHTML = `
            <div class="sub-content">
              <span>• ${escapeHtml(subItem.text)}</span>
              ${badgeHtml}
            </div>
            <div class="btn-group">
              <button onclick="editSub(${gIndex}, ${sIndex})">Edit</button>
              <button onclick="deleteSub(${gIndex}, ${sIndex})">Delete</button>
            </div>
          `;
          subList.appendChild(subEl);
        });

        groupEl.appendChild(subList);
        container.appendChild(groupEl);
      });
    }

    function renderCalendar() {
      const titleEl = document.getElementById('cal-title');
      const gridEl = document.getElementById('cal-grid');
      
      const monthNames = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];
      titleEl.innerText = `${currentCalYear}年 ${monthNames[currentCalMonth]}`;

      const dateTaskMap = {};
      todoData.forEach(group => {
        group.subs.forEach(sub => {
          if (sub.date) {
            if (!dateTaskMap[sub.date]) dateTaskMap[sub.date] = [];
            dateTaskMap[sub.date].push({
              groupTitle: group.title,
              text: sub.text,
              dateType: sub.dateType,
              date: sub.date
            });
          }
        });
      });

      gridEl.innerHTML = `
        <div class="cal-header-cell">日</div>
        <div class="cal-header-cell">一</div>
        <div class="cal-header-cell">二</div>
        <div class="cal-header-cell">三</div>
        <div class="cal-header-cell">四</div>
        <div class="cal-header-cell">五</div>
        <div class="cal-header-cell">六</div>
      `;

      const firstDayIndex = new Date(currentCalYear, currentCalMonth, 1).getDay();
      const totalDays = new Date(currentCalYear, currentCalMonth + 1, 0).getDate();

      const now = new Date();
      const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

      for (let i = 0; i < firstDayIndex; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'cal-cell empty';
        gridEl.appendChild(emptyCell);
      }

      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${currentCalYear}-${String(currentCalMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isToday = (dateStr === todayStr);

        const cell = document.createElement('div');
        cell.className = `cal-cell ${isToday ? 'today' : ''}`;

        const dateNum = document.createElement('div');
        dateNum.className = 'cal-date-num';
        dateNum.innerText = day;
        cell.appendChild(dateNum);

        if (dateTaskMap[dateStr]) {
          dateTaskMap[dateStr].forEach(item => {
            const taskPill = document.createElement('div');
            const isEvent = (item.dateType === 'event');
            taskPill.className = `cal-task-pill ${isEvent ? 'cal-task-event' : 'cal-task-deadline'}`;
            taskPill.title = `[${item.groupTitle}] ${item.text}\n(點擊查看完整內容)`;
            
            // 雙層工整排版：上層大項目標籤、下層任務主體（省略號防破版）
            taskPill.innerHTML = `
              <span class="cal-pill-tag">${escapeHtml(item.groupTitle)}</span>
              <span class="cal-pill-text">${isEvent ? '🗓️' : '⏳'} ${escapeHtml(item.text)}</span>
            `;
            taskPill.onclick = () => showTaskDetail(item.groupTitle, item.text, item.date, item.dateType);
            cell.appendChild(taskPill);
          });
        }

        gridEl.appendChild(cell);
      }
    }

    let draggedElement = null;

    function bindDragEvents(el, type, gIndex, sIndex = null) {
      el.addEventListener('dragstart', (e) => {
        e.stopPropagation();
        draggedElement = { type, gIndex, sIndex };
        el.classList.add('dragging');
      });

      el.addEventListener('dragend', (e) => {
        e.stopPropagation();
        el.classList.remove('dragging');
        draggedElement = null;
      });

      el.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.stopPropagation();
      });

      el.addEventListener('drop', (e) => {
        e.preventDefault();
        e.stopPropagation();

        if (!draggedElement) return;

        if (draggedElement.type === 'group' && type === 'group') {
          const fromIndex = draggedElement.gIndex;
          const toIndex = gIndex;
          if (fromIndex === toIndex) return;

          const movedItem = todoData.splice(fromIndex, 1)[0];
          todoData.splice(toIndex, 0, movedItem);
          saveData();
        }

        if (draggedElement.type === 'sub' && type === 'sub') {
          const fromGIndex = draggedElement.gIndex;
          const fromSIndex = draggedElement.sIndex;
          const toGIndex = gIndex;
          const toSIndex = sIndex;

          const movedSub = todoData[fromGIndex].subs.splice(fromSIndex, 1)[0];
          todoData[toGIndex].subs.splice(toSIndex, 0, movedSub);
          saveData();
        }
      });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[m];
      });
    }
  </script>
</head>
<body>

  <h2>To-Do List & Calendar</h2>
  <div class="status-bar" id="sync-status">🔄 正在連線雲端資料庫...</div>

  <div class="main-layout">
    <div class="left-panel">
      <div style="margin-bottom: 15px;">
        <input type="text" id="new-group-input" placeholder="Type" style="width: 220px;">
        <button onclick="addGroup()">Add</button>
      </div>
      <div id="todo-container"></div>
    </div>

    <div class="right-panel">
      <div class="calendar-container">
        <div class="calendar-nav">
          <button onclick="changeMonth(-1)">◀ 上個月</button>
          <h3 id="cal-title"></h3>
          <div>
            <button onclick="jumpToToday()">今天</button>
            <button onclick="changeMonth(1)">下個月 ▶</button>
          </div>
        </div>
        <div class="calendar-grid" id="cal-grid"></div>
      </div>
    </div>
  </div>

</body>
</html>
